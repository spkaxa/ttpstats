<script type="module">
  // 1. Импортируем нужные функции из Firebase
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // 2. Твоя конфигурация Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyC0rNfKYADXZLjMiXGy9inUzZmw-xYn160",
    authDomain: "ttpstatsof.firebaseapp.com",
    projectId: "ttpstatsof",
    storageBucket: "ttpstatsof.firebasestorage.app",
    messagingSenderId: "315139227692",
    appId: "1:315139227692:web:dec167343ae2245ca11189"
  };

  // 3. Инициализация
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // 4. Функция для получения данных по конкретному пути и дате
  async function getStatsData(path, dateKey) {
    const dbRef = ref(db, `stats/${path}/${dateKey}`);
    try {
      const snapshot = await get(dbRef);
      if (snapshot.exists()) {
        return snapshot.val(); // Вернёт объект, например { "рига": 22204.90, ... }
      } else {
        console.warn(`Данных для ${path} на дату "${dateKey}" не найдено.`);
        return null;
      }
    } catch (error) {
      console.error("Ошибка при чтении данных:", error);
      return null;
    }
  }

  // 5. Функция для получения списка всех доступных дат
  async function getAllDates(path) {
    const dbRef = ref(db, `stats/${path}`);
    try {
      const snapshot = await get(dbRef);
      if (snapshot.exists()) {
        // Возвращаем массив ключей (дат), отсортированный от новых к старым
        return Object.keys(snapshot.val()).sort((a, b) => new Date(b) - new Date(a));
      }
      return [];
    } catch (error) {
      console.error("Ошибка при получении списка дат:", error);
      return [];
    }
  }

  // 6. Пример использования:
  (async () => {
    // Получаем доступные даты для топа по балансу городов
    const dates = await getAllDates('cities/balance');
    console.log("Доступные даты:", dates);

    if (dates.length > 0) {
      // Загружаем данные за последнюю дату
      const latestDate = dates[0];
      const data = await getStatsData('cities/balance', latestDate);
      console.log(`Данные за ${latestDate}:`, data);
      // Здесь ты можешь вызвать свою функцию render(), передав ей эти данные
    }
  })();
</script>

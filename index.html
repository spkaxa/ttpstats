<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>timetoplay stats — ttpstats</title>
<style>
:root {
  --bg:#0d0d10; --bg2:#16161c; --bg3:#1f1f28; --accent:#f5a623; --accent2:#ffc857;
  --text:#e8e8ee; --text2:#9a9aa8; --text3:#5c5c6a; --border:#2a2a36;
  --green:#4ade80; --red:#ef4444; --gold:#fbbf24; --purple:#a78bfa;
  --gridline:rgba(128,128,128,0.18);
  --header-bg:linear-gradient(180deg, #131318 0%, #0d0d10 100%);
  --win:#4ade80; --lose:#ef4444;
}
body.light {
  --bg:#f4f4f7; --bg2:#ffffff; --bg3:#ebebee; --accent:#b45309; --accent2:#d97706;
  --text:#18181b; --text2:#52525b; --text3:#8a8a94; --border:#d8d8dc;
  --green:#16a34a; --red:#dc2626; --gold:#b45309; --purple:#7c3aed;
  --gridline:rgba(0,0,0,0.1);
  --header-bg:linear-gradient(180deg, #ffffff 0%, #f4f4f7 100%);
  --win:#16a34a; --lose:#dc2626;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
  background: var(--bg); color: var(--text); min-height:100vh; line-height:1.5;
  background-image: radial-gradient(ellipse at top, rgba(245,166,35,.06), transparent 60%);
  transition: background .25s, color .25s;
}
body.light { background-image: radial-gradient(ellipse at top, rgba(180,83,9,.08), transparent 60%); }

/* ============ TOP BAR ============ */
.top-bar {
  position: fixed; top: 18px; right: 18px; z-index: 999;
  display: flex; gap: 8px; align-items: center;
}
#theme-toggle, #music-toggle {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--bg2); border: 1px solid var(--border);
  color: var(--text); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s; font-family: inherit;
  box-shadow: 0 2px 10px rgba(0,0,0,.15);
}
#theme-toggle:hover, #music-toggle:hover { transform: scale(1.08); border-color: var(--accent); }
#music-toggle.playing { background: var(--accent); color: #fff; }
.volume-wrap {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 20px; padding: 0 12px; height: 40px;
  box-shadow: 0 2px 10px rgba(0,0,0,.15);
}
.volume-wrap input[type=range] {
  width: 70px; accent-color: var(--accent); cursor: pointer;
}
.volume-wrap .vol-icon { font-size: 13px; color: var(--text3); }

header {
  padding:36px 24px 18px; border-bottom:1px solid var(--border);
  background: var(--header-bg);
}
.header-inner { max-width:1100px; margin:0 auto; padding-right: 220px; }
h1 {
  font-size:34px; font-weight:800; letter-spacing:-0.6px; margin-bottom:6px;
  background: linear-gradient(90deg, var(--accent) 0%, var(--accent2) 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  display:inline-flex; align-items:baseline; gap:10px; flex-wrap:wrap;
}
.version-badge {
  display:inline-block; font-size:11px; font-weight:700;
  background:var(--bg3); color:var(--text2);
  padding:3px 9px; border-radius:10px; border:1px solid var(--border);
  letter-spacing:.5px;
  -webkit-text-fill-color:var(--text2);
}
.subtitle { color:var(--text2); font-size:13px; margin-bottom:4px; letter-spacing:.2px; }
.subtitle-future { color: var(--accent); font-size:12px; margin-bottom:10px; letter-spacing:.3px; font-weight:600; }
.creator { color:var(--text3); font-size:12px; }
.creator a { color:var(--accent); text-decoration:none; font-weight:600; }
.creator a:hover { text-decoration:underline; }

/* ============ ADS ============ */
.ads-bar {
  max-width:1100px; margin: 12px auto 0; padding: 0 24px;
  display: flex; gap: 8px; flex-wrap: wrap;
}
.ad-btn {
  flex: 1; min-width: 140px;
  padding: 10px 16px;
  background: var(--bg2); border: 1px dashed var(--border);
  color: var(--text3); font-family: inherit; font-size: 11px;
  font-weight: 600; letter-spacing: .3px; cursor: pointer;
  border-radius: 6px; transition: all .15s;
  text-align: center;
}
.ad-btn.active {
  background: linear-gradient(135deg, #7c2d12, #b45309);
  color: #fff; border: 1px solid #d97706;
  cursor: pointer;
}
.ad-btn.active:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(180,83,9,.4); }
.ad-btn.empty { cursor: default; opacity: .45; }
.ad-btn.empty:hover { transform: none; }

/* ============ TABS ============ */
.tabs {
  max-width:1100px; margin:0 auto; padding:16px 24px 0;
  display:flex; gap:4px; flex-wrap:wrap; border-bottom:1px solid var(--border);
}
.tabs button {
  background:transparent; border:none; color:var(--text2); padding:12px 16px;
  font-size:14px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent;
  margin-bottom:-1px; transition:all .15s; font-family:inherit; white-space:nowrap;
}
.tabs button:hover { color:var(--text); }
.tabs button.active { color:var(--accent); border-bottom-color:var(--accent); }

main { max-width:1100px; margin:0 auto; padding:24px; }
.date-bar { display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
.date-bar label { color:var(--text2); font-size:12px; font-weight:600; letter-spacing:.3px; }
.date-bar select {
  background:var(--bg3); color:var(--text); border:1px solid var(--border);
  padding:9px 12px; font-family:inherit; font-size:13px; border-radius:6px;
  cursor:pointer; min-width:220px;
}
.date-bar select:focus { outline:2px solid var(--accent); }
.nav-btn {
  background:var(--bg3); color:var(--text); border:1px solid var(--border);
  width:34px; height:34px; border-radius:6px; cursor:pointer; font-size:14px;
  display:flex; align-items:center; justify-content:center; font-family:inherit;
  transition:all .15s;
}
.nav-btn:hover:not(:disabled) { background:var(--bg2); border-color:var(--accent); color:var(--accent); }
.nav-btn:disabled { opacity:.3; cursor:not-allowed; }
.all-time-btn {
  margin-left:auto; background:linear-gradient(135deg,#7c2d12,#b45309); color:#fff;
  border:none; padding:9px 16px; border-radius:6px; cursor:pointer; font-size:12px;
  font-weight:700; letter-spacing:.3px; font-family:inherit; transition:all .15s;
}
.all-time-btn:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(180,83,9,.4); }
.all-time-btn.active { background:linear-gradient(135deg,#d97706,#fbbf24); }

/* ============ CARDS ============ */
.card {
  background:var(--bg2); border:1px solid var(--border); border-radius:10px;
  padding:20px; margin-bottom:16px;
}
.card h2 {
  font-size:15px; font-weight:700; color:var(--accent); margin-bottom:4px; letter-spacing:.3px;
}
.card .card-sub { color:var(--text3); font-size:11px; margin-bottom:16px; }
.card .card-note {
  color:var(--text3); font-size:11px; margin-top:14px; font-style:italic;
  padding-top:12px; border-top:1px dashed var(--border); line-height:1.6;
}

/* Мини-селект внутри карточки */
.card-date-select {
  background: var(--bg3); color: var(--text); border: 1px solid var(--border);
  padding: 5px 10px; font-family: inherit; font-size: 11px; border-radius: 5px;
  cursor: pointer; margin-bottom: 12px;
}
.card-date-select:focus { outline: 2px solid var(--accent); }

/* ============ LISTS ============ */
.top-list { display:flex; flex-direction:column; gap:4px; }
.top-item {
  display:grid; grid-template-columns:44px 1fr auto auto; gap:12px; align-items:center;
  padding:10px 14px; background:var(--bg3); border-radius:6px;
  transition:all .15s; border-left:3px solid transparent;
}
.top-item:hover { transform:translateX(2px); }
body:not(.light) .top-item:hover { background:#232330; }
body.light .top-item:hover { background:#e0e0e5; }
.top-item.r1 { border-left-color:#ffd700; }
.top-item.r2 { border-left-color:#c0c0c0; }
.top-item.r3 { border-left-color:#cd7f32; }
body:not(.light) .top-item.r1 { background:linear-gradient(90deg,rgba(255,215,0,.09),transparent 45%); }
body:not(.light) .top-item.r2 { background:linear-gradient(90deg,rgba(192,192,192,.07),transparent 45%); }
body:not(.light) .top-item.r3 { background:linear-gradient(90deg,rgba(205,127,50,.07),transparent 45%); }
body.light .top-item.r1 { background:linear-gradient(90deg,rgba(255,215,0,.18),transparent 45%); }
body.light .top-item.r2 { background:linear-gradient(90deg,rgba(192,192,192,.2),transparent 45%); }
body.light .top-item.r3 { background:linear-gradient(90deg,rgba(205,127,50,.15),transparent 45%); }

.rank { font-size:15px; font-weight:800; color:var(--text2); text-align:center; font-variant-numeric:tabular-nums; }
.r1 .rank { color:#e6b800; } .r2 .rank { color:#a0a0a0; } .r3 .rank { color:#cd7f32; }
body.light .r1 .rank { color:#b45309; }

.name { font-size:14px; font-weight:600; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.name .sub-note { color:var(--text3); font-size:10px; font-weight:400; margin-left:4px; }
.value { font-size:14px; font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap; }
.value .unit { color:var(--text3); font-weight:400; font-size:11px; margin-left:3px; }
.arrow { font-size:12px; font-weight:700; padding:2px 7px; border-radius:4px; min-width:44px; text-align:center; font-variant-numeric:tabular-nums; }
.arrow.up { color:var(--green); background:rgba(74,222,128,.12); }
.arrow.down { color:var(--red); background:rgba(239,68,68,.12); }
.arrow.same { color:var(--text3); background:rgba(92,92,106,.15); }
.arrow.new { color:var(--purple); background:rgba(167,139,250,.15); font-size:10px; }
.arrow.dash { color:var(--text3); background:transparent; }

/* ============ CHARTS ============ */
.chart-wrap { background:var(--bg3); border-radius:6px; padding:16px; margin-top:8px; }
.chart-wrap svg { width:100%; height:180px; display:block; overflow:visible; }
.chart-labels { display:flex; justify-content:space-between; margin-top:8px; font-size:10px; color:var(--text3); font-variant-numeric:tabular-nums; }

.chart-single {
  background:var(--bg3); border-radius:6px; padding:28px 16px; text-align:center;
  border:1px dashed var(--border);
}
.chart-single .val { font-size:32px; font-weight:900; color:var(--accent); margin-bottom:4px; }
.chart-single .date { font-size:11px; color:var(--text3); letter-spacing:1px; text-transform:uppercase; }
.chart-single .wait { font-size:11px; color:var(--text3); margin-top:10px; font-style:italic; }

.chart-block { margin-bottom:22px; padding-bottom:22px; border-bottom:1px dashed var(--border); }
.chart-block:last-child { margin-bottom:0; padding-bottom:0; border-bottom:none; }
.chart-title { font-size:14px; font-weight:700; color:var(--text); margin-bottom:10px; display:flex; align-items:center; gap:8px; }
.chart-title .chart-pos { background:var(--bg3); color:var(--text3); font-size:10px; font-weight:700; padding:1px 7px; border-radius:3px; letter-spacing:.5px; }

/* ============ WARS ============ */
.war-item {
  background:var(--bg3); border-radius:8px; padding:14px 18px;
  margin-bottom:10px; border-left:4px solid var(--accent);
  transition:all .15s;
}
.war-item:hover { transform:translateX(3px); }
.war-date { font-size:11px; color:var(--text3); letter-spacing:1px; margin-bottom:8px; text-transform:uppercase; font-weight:700; display:flex; align-items:center; gap:6px; }
.war-date::before { content:''; display:inline-block; width:6px; height:6px; background:var(--accent); border-radius:50%; }
.war-teams { display:flex; align-items:center; gap:14px; flex-wrap:wrap; font-size:15px; font-weight:700; margin-bottom:8px; }
.war-team { color:var(--text); }
.war-team.winner { color:var(--win); text-shadow:0 0 12px rgba(74,222,128,.35); }
.war-team.loser { color:var(--text2); opacity:0.7; }
.war-vs { color:var(--text3); font-size:12px; font-weight:700; letter-spacing:2px; opacity:0.7; }
.war-result { font-size:12px; color:var(--text3); letter-spacing:.5px; display:flex; align-items:center; gap:8px; }
.war-result .trophy { color:var(--gold); font-size:13px; }
.war-result .faction { background:var(--bg2); color:var(--text2); padding:1px 8px; border-radius:3px; font-size:10px; font-weight:700; letter-spacing:.5px; border:1px solid var(--border); }
body.light .war-result .faction { background:#fff; }

/* ============ MODAL ============ */
.modal {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(0,0,0,.75); backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center;
  padding: 24px;
}
.modal.open { display: flex; }
.modal-content {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 12px; padding: 28px 32px;
  max-width: 500px; width: 100%;
  box-shadow: 0 30px 80px rgba(0,0,0,.6);
  animation: modalIn .2s ease-out;
}
@keyframes modalIn { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-content h3 {
  font-size: 18px; color: var(--accent); margin-bottom: 14px;
  display: flex; align-items: center; gap: 10px;
}
.modal-content p {
  color: var(--text2); font-size: 14px; line-height: 1.7; margin-bottom: 10px;
}
.modal-content .highlight {
  background: var(--bg3); padding: 10px 14px; border-radius: 6px;
  border-left: 3px solid var(--accent); margin: 14px 0;
  font-family: monospace; font-size: 13px; color: var(--accent);
}
.modal-content button {
  margin-top: 18px; width: 100%;
  padding: 12px; background: var(--bg3); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px;
  cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 700;
  letter-spacing: .5px; transition: all .15s;
}
.modal-content button:hover { border-color: var(--accent); color: var(--accent); }

/* ============ FOOTER ============ */
footer {
  max-width:1100px; margin:50px auto 0; padding:26px 24px;
  border-top:1px solid var(--border); color:var(--text3); font-size:12px;
  text-align:center; line-height:2;
}
footer a { color:var(--accent); text-decoration:none; font-weight:600; }
footer a:hover { text-decoration:underline; }
footer .sep { margin:8px 0; color:var(--border); }

.empty { text-align:center; padding:50px 20px; color:var(--text3); font-size:13px; font-style:italic; }
.badge-alltime {
  display:inline-block; font-size:9px; background:linear-gradient(135deg,#d97706,#fbbf24);
  color:#000; padding:2px 7px; border-radius:3px; font-weight:800;
  letter-spacing:.3px; margin-left:8px; vertical-align:middle;
}

@media (max-width:820px) {
  .top-item { grid-template-columns:32px 1fr auto; }
  .arrow { display:none; }
  h1 { font-size:22px; }
  .version-badge { font-size:9px; padding:2px 7px; }
  .tabs { overflow-x:auto; flex-wrap:nowrap; padding-bottom:0; }
  .tabs::-webkit-scrollbar { height:0; }
  .top-bar { top:12px; right:12px; gap: 6px; }
  #theme-toggle, #music-toggle { width:34px; height:34px; font-size:14px; }
  .volume-wrap { height:34px; padding: 0 8px; }
  .volume-wrap input[type=range] { width: 50px; }
  .header-inner { padding-right: 0; }
  .ads-bar { flex-direction: column; }
}
</style>
</head>

<footer>

</footer>

<!-- AD MODAL -->
<div class="modal" id="ad-modal">
  <div class="modal-content" id="ad-content"></div>
</div>

/* =========================================================
   HELPERS
   ========================================================= */
function fmtDate(d) {
  const [datePart, timePart] = d.split(' ');
  const [y, m, day] = datePart.split('-');
  const [hh, mm] = timePart.split(':');
  return `${day}.${m}.${y} ${parseInt(hh)}:${mm}`;
}

function fmtNumber(v) {
  if (typeof v !== 'number') return String(v);
  const hasDecimals = v % 1 !== 0;
  return v.toLocaleString('ru-RU', {
    minimumFractionDigits: hasDecimals ? 2 : 0,
    maximumFractionDigits: 2,
  });
}

function normalizeKey(name) {
  return name.toLowerCase().replace('французкая', 'французская').trim();
}

function computeArrow(currentList, prevList) {
  const map = {};
  if (prevList) prevList.forEach((it, i) => { map[normalizeKey(it.name)] = i + 1; });
  const result = {};
  currentList.forEach((it, i) => {
    const curRank = i + 1;
    const prevRank = map[normalizeKey(it.name)];
    if (prevRank === undefined) result[it.name] = { type:'new', text:'NEW' };
    else if (prevRank > curRank) result[it.name] = { type:'up', text:'▲ ' + (prevRank - curRank) };
    else if (prevRank < curRank) result[it.name] = { type:'down', text:'▼ ' + (curRank - prevRank) };
    else result[it.name] = { type:'same', text:'—' };
  });
  return result;
}

function collectAllTime(snapshots) {
  const best = {};
  Object.keys(snapshots).sort().forEach(date => {
    snapshots[date].forEach(it => {
      const nk = normalizeKey(it.name);
      if (!best[nk] || it.value > best[nk].value) best[nk] = { ...it };
    });
  });
  return Object.values(best).sort((a, b) => b.value - a.value).slice(0, 10);
}

/* =========================================================
   RENDER CATEGORY CARD
   ========================================================= */
function renderCategoryCard(catKey, category) {
  if (!category) return '';

  const selected = state.categoryDates[catKey] || category.dates[category.dates.length - 1];
  const dates = category.dates;
  const isAllTime = selected === '__ALL__';

  let list;
  if (isAllTime) {
    list = collectAllTime(category.snapshots);
  } else {
    list = category.snapshots[selected] || [];
  }

  let arrowsMap = null;
  if (!isAllTime) {
    const idx = dates.indexOf(selected);
    if (idx > 0) arrowsMap = computeArrow(list, category.snapshots[dates[idx - 1]]);
  }

  // Если дат больше одной — показываем селект
  let dateSelectorHTML = '';
  if (dates.length > 1) {
    const options = dates.map(d => {
      const sel = d === selected ? 'selected' : '';
      return `<option value="${d}" ${sel}>📅 ${fmtDate(d)}</option>`;
    }).join('');
    const allSel = isAllTime ? 'selected' : '';
    dateSelectorHTML = `
      <select class="card-date-select" onchange="onCategoryDateChange('${catKey}', this.value)">
        ${options}
        <option value="__ALL__" ${allSel}>🏆 За всё время</option>
      </select>
    `;
  }

  let headingDate;
  if (isAllTime) {
    headingDate = 'за всё время наблюдений — с 24 сентября';
  } else {
    headingDate = fmtDate(selected) + ' МСК';
  }

  const badge = isAllTime ? '<span class="badge-alltime">ЗА ВСЁ ВРЕМЯ</span>' : '';

  return `
    <div class="card">
      <h2>${category.title} ${badge}</h2>
      <div class="card-sub">${headingDate}</div>
      ${dateSelectorHTML}
      ${renderTopList(list, category.unit, arrowsMap)}
      ${category.note ? `<div class="card-note">${category.note}</div>` : ''}
    </div>
  `;
}

function onCategoryDateChange(catKey, value) {
  state.categoryDates[catKey] = value;
  render();
}

/* =========================================================
   RENDER HELPERS
   ========================================================= */
function makeListItem(rank, item, unit, arrowInfo) {
  const rClass = rank <= 3 ? ' r' + rank : '';
  let arrowHTML = '';
  if (arrowInfo) arrowHTML = `<span class="arrow ${arrowInfo.type}">${arrowInfo.text}</span>`;
  else arrowHTML = `<span class="arrow dash"></span>`;
  const nameHTML = item.sub
    ? `${item.name}<span class="sub-note"> ${item.sub}</span>`
    : item.name;
  let valueHTML;
  if (typeof item.display === 'string') valueHTML = item.display;
  else valueHTML = fmtNumber(item.value) + `<span class="unit">${unit || ''}</span>`;
  return `
    <div class="top-item${rClass}">
      <span class="rank">#${rank}</span>
      <span class="name">${nameHTML}</span>
      <span class="value">${valueHTML}</span>
      ${arrowHTML}
    </div>
  `;
}

function renderTopList(list, unit, arrowsMap) {
  if (!list || list.length === 0) return '<div class="empty">Нет данных</div>';
  return '<div class="top-list">' +
    list.map((it, i) => makeListItem(i + 1, it, unit || '', arrowsMap ? arrowsMap[it.name] : null)).join('') +
    '</div>';
}

function renderLineChart(history) {
  if (!history || history.length === 0) return '<div class="empty">Нет данных</div>';
  if (history.length === 1) {
    return `
      <div class="chart-single">
        <div class="val">${fmtNumber(history[0].value)} ₽</div>
        <div class="date">${fmtDate(history[0].date)} МСК</div>
        <div class="wait">⚡ ожидание следующих обновлений</div>
      </div>
    `;
  }
  const W = 800, H = 180, PAD = 30;
  const values = history.map(h => h.value);
  const minV = Math.min(...values), maxV = Math.max(...values);
  const rangeV = maxV - minV || 1;
  const stepX = (W - PAD*2) / (history.length - 1);
  const points = history.map((h, i) => {
    const x = PAD + i * stepX;
    const y = H - PAD - ((h.value - minV) / rangeV) * (H - PAD*2);
    return { x, y, ...h };
  });
  const pathD = points.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
  const areaD = pathD + ` L${points[points.length-1].x.toFixed(1)},${H-PAD} L${points[0].x.toFixed(1)},${H-PAD} Z`;
  let grid = '';
  for (let i = 0; i <= 4; i++) {
    const y = PAD + (H - PAD*2) * (i/4);
    grid += `<line x1="${PAD}" y1="${y}" x2="${W-PAD}" y2="${y}" stroke="var(--gridline)" stroke-width="1" stroke-dasharray="2,4"/>`;
  }
  const dots = points.map(p => `<circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--accent)" stroke="var(--bg2)" stroke-width="2"/>`).join('');
  const labels = points.map((p, i) => {
    if (history.length > 4 && i !== 0 && i !== points.length - 1 && i % 2 !== 0) return '';
    return `<text x="${p.x}" y="${p.y - 10}" fill="var(--gold)" font-size="10" text-anchor="middle" font-weight="700">${fmtNumber(p.value)}</text>`;
  }).join('');
  const xLabels = points.map(p => `
    <text x="${p.x}" y="${H - 8}" fill="var(--text3)" font-size="9" text-anchor="middle">${fmtDate(p.date).split(' ')[0]}</text>
  `).join('');
  return `
    <div class="chart-wrap">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
        ${grid}
        <path d="${areaD}" fill="rgba(245,166,35,0.15)"/>
        <path d="${pathD}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
        ${dots}
        ${labels}
        ${xLabels}
      </svg>
      <div class="chart-labels">
        <span>мин: ${fmtNumber(minV)}</span>
        <span>макс: ${fmtNumber(maxV)}</span>
        <span>Δ: ${fmtNumber(values[values.length-1] - values[0])}</span>
      </div>
    </div>
  `;
}

    updateMusicBtn();
  }).catch(() => {
    // Автовоспроизведение заблокировано — ждём клика
  });
}

musicBtn.onclick = () => {
  if (musicPlaying) {
    music.pause();
    musicPlaying = false;
  } else {
    music.play().then(() => {
      musicStarted = true;
      musicPlaying = true;
      updateMusicBtn();
    }).catch(() => {});
  }
  updateMusicBtn();
};

volSlider.oninput = (e) => {
  music.volume = parseFloat(e.target.value);
};

music.volume = parseFloat(volSlider.value);

// Пытаемся запустить при первом клике
document.addEventListener('click', () => tryStartMusic(), { once: true });
document.addEventListener('keydown', () => tryStartMusic(), { once: true });

/* =========================================================
   THEME
   ========================================================= */
const themeBtn = document.getElementById('theme-toggle');
function applyTheme(theme) {
  document.body.classList.toggle('light', theme === 'light');
  themeBtn.textContent = theme === 'light' ? '🌙' : '☀️';
  themeBtn.title = theme === 'light' ? 'Тёмная тема' : 'Светлая тема';
}
let currentTheme = localStorage.getItem('ttp_theme') || 'dark';
applyTheme(currentTheme);
themeBtn.onclick = () => {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('ttp_theme', currentTheme);
  applyTheme(currentTheme);
};

/* =========================================================
   ADS
   ========================================================= */
const AD_CONTENT = {
  arbuzovsk: {
    title: '🍉 ПВП Арена Арбузовск',
    html: `
      <p>На <span style="color:var(--accent);font-weight:700">/t spawn арбузовск</span> есть прикольная ПВП арена на 4 чанка.</p>
      <p>Она не плоская, интересная, прикольная — тут можно сражаться со всеми кем хочешь.</p>
      <div class="highlight">ПРАВИЛ НЕТ</div>
      <p>Можно заказать арену на время для ПВП с кем-то. Приходи сражайся!</p>
      <p style="color:var(--accent);font-size:12px;margin-top:14px">⚡ Скоро тут же откроется магазин</p>
      <button onclick="closeAd()">Закрыть</button>
    `
  }
};

function openAd(key) {
  const ad = AD_CONTENT[key];
  if (!ad) return;
  const modal = document.getElementById('ad-modal');
  document.getElementById('ad-content').innerHTML = `
    <h3>${ad.title}</h3>
    ${ad.html}
  `;
  modal.classList.add('open');
}

function closeAd() {
  document.getElementById('ad-modal').classList.remove('open');
}

document.getElementById('ad-modal').addEventListener('click', (e) => {
  if (e.target.id === 'ad-modal') closeAd();
});

/* =========================================================
   BOOT
   ========================================================= */
render();
updateMusicBtn();
</script>
</body>

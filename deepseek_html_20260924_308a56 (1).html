/* =========================================================
   ЛОГИКА ЗАГРУЗКИ
   ========================================================= */
const logEl = document.getElementById('log');
const btn = document.getElementById('upload-btn');

function log(msg, cls = '') {
  logEl.classList.add('show');
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

btn.onclick = async () => {
  btn.disabled = true;
  btn.textContent = 'ЗАГРУЗКА...';
  logEl.innerHTML = '';
  log('▶ Начинаю загрузку данных в Firebase...', 'info');

  try {
    // Основной объект
    await set(ref(db, 'stats/cities/balance/snapshots'), DATA.cities.balance.snapshots);
    log('✓ Города → баланс (snapshots)', 'ok');

    await set(ref(db, 'stats/cities/balance/histories'), DATA.cities.balance.histories);
    log('✓ Города → баланс (histories)', 'ok');

    await set(ref(db, 'stats/cities/population'), DATA.cities.population);
    log('✓ Города → население', 'ok');

    await set(ref(db, 'stats/cities/size'), DATA.cities.size);
    log('✓ Города → размер', 'ok');

    await set(ref(db, 'stats/players/balance'), DATA.players.balance);
    log('✓ Игроки → баланс', 'ok');

    await set(ref(db, 'stats/players/active'), DATA.players.active);
    log('✓ Игроки → активные', 'ok');

    await set(ref(db, 'stats/players/shards'), DATA.players.shards);
    log('✓ Игроки → осколки', 'ok');

    await set(ref(db, 'stats/players/rubies'), DATA.players.rubies);
    log('✓ Игроки → рубины', 'ok');

    await set(ref(db, 'stats/nations/balance'), DATA.nations.balance);
    log('✓ Нации → баланс', 'ok');

    await set(ref(db, 'stats/nations/size'), DATA.nations.size);
    log('✓ Нации → размер', 'ok');

    await set(ref(db, 'stats/nations/citizens'), DATA.nations.citizens);
    log('✓ Нации → граждане', 'ok');

    await set(ref(db, 'stats/wars'), DATA.wars);
    log('✓ Войны вайпа', 'ok');

    log('', '');
    log('🎉 ГОТОВО! Все данные загружены в Firebase.', 'ok');
    log('Теперь открой свой сайт — кружок в правом верхнем углу должен стать зелёным.', 'info');

    btn.textContent = '✓ ГОТОВО';
  } catch (e) {
    log('❌ ОШИБКА: ' + e.message, 'err');
    log('Проверь правила Firebase (Rules). Должно быть:', 'err');
    log('{ "rules": { "stats": { ".read": true, ".write": true } } }', 'info');
    btn.disabled = false;
    btn.textContent = '↻ ПОПРОБОВАТЬ СНОВА';
  }
};
